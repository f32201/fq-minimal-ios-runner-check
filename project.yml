name: HelloFangQiao
options:
  bundleIdPrefix: com.fangqiao.hello
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HelloFangQiao:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fangqiao.hello
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  HelloFangQiaoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HelloFangQiao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fangqiao.hello.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HelloFangQiao:
    build:
      targets:
        HelloFangQiao: all
        HelloFangQiaoTests: [test]
    test:
      targets:
        - HelloFangQiaoTests
